<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>星婉 · Rust具身四合一桌宠终端</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      height: 100vh;
      width: 100vw;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 8px;
    }

    /* 纯净悬浮桌宠容器（完全无黑底/无矩形背景框） */
    .pet-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      height: 100%;
    }

    /* 顶部思维链台词气泡 (截图同款经典深蓝/紫蓝气泡) */
    .speech-bubble-wrapper {
      position: relative;
      z-index: 10;
      margin-bottom: 8px;
      animation: float-bubble 3.2s ease-in-out infinite alternate;
      cursor: pointer;
    }
    @keyframes float-bubble {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-5px); }
    }
    .speech-bubble {
      background: #526eff;
      color: #ffffff;
      padding: 9px 15px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
      text-align: center;
      max-width: 260px;
      box-shadow: 0 8px 24px rgba(82, 110, 255, 0.45);
      position: relative;
      word-break: break-word;
      transition: all 0.25s ease;
    }
    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 7px 7px 0 7px;
      border-style: solid;
      border-color: #526eff transparent transparent transparent;
    }
    .speech-bubble:hover {
      background: #4361ee;
      transform: scale(1.02);
    }

    /* 具身透明角色本体 (点击压扁/触摸反馈) */
    .char-container {
      position: relative;
      width: 220px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
    }
    .char-sprite {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.35));
      animation: char-breath 3.6s ease-in-out infinite;
      transition: transform 0.15s ease-out;
    }
    @keyframes char-breath {
      0%, 100% { transform: translateY(0px) scale(1, 1); }
      50% { transform: translateY(-6px) scale(1.02, 0.99); }
    }
    .char-container:active .char-sprite {
      transform: scale(1.15, 0.85) translateY(10px);
    }

    /* 切换角色浮动小胶囊 */
    .skin-switch-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #93c5fd;
      border-radius: 20px;
      padding: 3px 9px;
      font-size: 11px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      z-index: 20;
      opacity: 0.2;
      transition: opacity 0.2s;
    }
    .skin-switch-btn:hover {
      opacity: 1;
    }

    /* 底部收缩式任务面板 & 对话输入框 (平时隐藏，鼠标移入才优雅呼出) */
    .drawer-toggle {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #c084fc;
      border-radius: 12px;
      padding: 3px 12px;
      font-size: 11px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      margin-top: 4px;
      transition: all 0.2s;
      z-index: 10;
    }
    .drawer-toggle:hover {
      background: rgba(139, 92, 246, 0.3);
      color: #ffffff;
    }

    .tools-drawer {
      width: 290px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(139, 92, 246, 0.5);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 15;
    }
    .tools-drawer.collapsed {
      opacity: 0;
      pointer-events: none;
      transform: translateY(15px);
      height: 0;
      padding: 0;
      margin: 0;
      overflow: hidden;
      border: none;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
    }
    .hud-tag {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
      font-family: monospace;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
      transition: width 0.3s ease;
    }

    .input-row {
      display: flex;
      gap: 6px;
    }
    .input-box {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 8px;
      color: #ffffff;
      font-size: 11px;
      padding: 5px 8px;
      outline: none;
    }
    .input-box:focus {
      border-color: #38bdf8;
    }
    .btn-send {
      background: #6366f1;
      border: none;
      color: white;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="pet-stage">
    <!-- 皮肤/视角切换按钮（透明悬浮） -->
    <button class="skin-switch-btn" onclick="togglePose()" title="点击切换星婉视角与姿态">
      <span id="skinLabel">🔄 切换姿态</span>
    </button>

    <!-- 1. 顶部对话思维气泡 (截图同款纯净气泡) -->
    <div class="speech-bubble-wrapper" onclick="pokePet()">
      <div id="speechText" class="speech-bubble">叫我把风呀，笨蛋主人~ ✨</div>
    </div>

    <!-- 2. 纯透明角色主体 (星婉·四翅应龙娘，无黑底，无卡片框) -->
    <div class="char-container" onclick="pokePet()">
      <img id="petImg" class="char-sprite" src="./assets/xingwan_transparent/chibi_front.png" alt="星婉桌宠" />
    </div>

    <!-- 3. 抽屉控制微型按钮 -->
    <button class="drawer-toggle" onclick="toggleDrawer()">
      <span id="drawerArrow">▲ 任务与交互面板</span>
    </button>

    <!-- 4. 收拢式任务 & 交流抽屉 (需要时点开，平时完全不挡视线) -->
    <div id="toolsDrawer" class="tools-drawer collapsed">
      <div class="hud-row">
        <span class="hud-tag" style="color: #4ade80;">● RUST CORE</span>
        <span id="actionTag" class="hud-tag">IDLE</span>
        <span id="progressText" class="hud-tag">0%</span>
      </div>

      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>

      <div class="input-row">
        <input id="userCmd" type="text" class="input-box" placeholder="与星婉对话 / 派发任务..." onkeydown="if(event.key==='Enter') sendCommand()" />
        <button class="btn-send" onclick="sendCommand()">发送</button>
      </div>
    </div>
  </div>

  <script>
    // 星婉专属台词池 (结合上古四翅应龙 + 剧本总监人设)
    const petQuotes = [
      "叫我把风呀，笨蛋主人~ ✨",
      "主人回来啦！星婉一直在右上角为您守着进度呢~",
      "四翅天翼已就绪！随时可以为主人推演爆款剧本！",
      "摸摸小龙角可以，不许拽尾巴哦！(≧ω≦)",
      "今天也要记得多喝水，屏幕看久了眼睛会酸哒~",
      "前三秒黄金留存已锁定，星婉监工绝不摸鱼！",
      "再戳一下我就要用龙炎把任务进度烧满啦！",
      "星婉是上古四翅应龙神尊，才不是小笨鱼呢！哼~"
    ];

    const xingwanPoses = [
      { name: '正面视角', src: './assets/xingwan_transparent/chibi_front.png', msg: '星婉正面迎着主人！大眼睛和双麻花辫都在哦~' },
      { name: '侧面视角', src: './assets/xingwan_transparent/chibi_side.png', msg: '侧颜看星婉的小龙尾和四翅剪影！' },
      { name: '背面视角', src: './assets/xingwan_transparent/chibi_back.png', msg: '背面是女仆装大蝴蝶结系带和长长发丝~' },
      { name: '神女姿态', src: './assets/xingwan_transparent/pose_1.png', msg: '应龙灵气爆发，为您护持工种管线！' },
      { name: '灵动姿态', src: './assets/xingwan_transparent/pose_2.png', msg: '随时准备起飞，派发下一个Top目标！' }
    ];

    let currentPoseIdx = 0;
    let drawerOpen = false;

    // 切换星婉姿态
    function togglePose() {
      currentPoseIdx = (currentPoseIdx + 1) % xingwanPoses.length;
      const pose = xingwanPoses[currentPoseIdx];
      const img = document.getElementById('petImg');
      const label = document.getElementById('skinLabel');
      
      img.style.opacity = '0.3';
      setTimeout(() => {
        img.src = pose.src;
        img.style.opacity = '1';
      }, 100);

      label.innerText = '🐉 ' + pose.name;
      setBubble(pose.msg);
    }

    // 戳一戳互动
    function pokePet() {
      const img = document.getElementById('petImg');
      img.style.transform = 'scale(1.2, 0.8) translateY(12px)';
      setTimeout(() => {
        img.style.transform = 'scale(0.9, 1.1) translateY(-6px)';
        setTimeout(() => {
          img.style.transform = '';
        }, 150);
      }, 150);

      const quote = petQuotes[Math.floor(Math.random() * petQuotes.length)];
      setBubble(quote);
    }

    function setBubble(text) {
      document.getElementById('speechText').innerText = text;
    }

    function toggleDrawer() {
      drawerOpen = !drawerOpen;
      const drawer = document.getElementById('toolsDrawer');
      const arrow = document.getElementById('drawerArrow');
      if (drawerOpen) {
        drawer.classList.remove('collapsed');
        arrow.innerText = '▼ 收起面板';
      } else {
        drawer.classList.add('collapsed');
        arrow.innerText = '▲ 任务与交互面板';
      }
    }

    // 轮询 Rust Native 后台状态
    async function syncRuntimeState() {
      try {
        const res = await fetch('./tasks/runtime_state.json?t=' + Date.now());
        if (!res.ok) return;
        const data = await res.json();

        if (data.bubble_text) {
          setBubble(data.bubble_text);
        }
        if (data.motion) {
          document.getElementById('actionTag').innerText = data.motion;
        }
        if (typeof data.progress === 'number') {
          document.getElementById('progressBar').style.width = data.progress + '%';
          document.getElementById('progressText').innerText = data.progress + '%';
        }
      } catch (e) {
        // 后台待机中
      }
    }

    function sendCommand() {
      const input = document.getElementById('userCmd');
      const val = input.value.trim();
      if (!val) return;
      setBubble('收到法旨：' + val + '！已派发至 Rust 调度中心~');
      input.value = '';
    }

    setInterval(syncRuntimeState, 1000);
  </script>
</body>
</html>
