[package]
name = "agent-mascot-workstation"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
colored = "2.1"
goblin = "0.8"       # 原生二进制 (ELF, PE, Mach-O) 逆向解析
regex = "1.10"       # 模式匹配与反混淆特征提取
walkdir = "2.5"      # 极速递归目录与资产遍历
notify = { version = "8.2.2", features = ["default"] }

[[bin]]
name = "agent-mascot"
path = "src/bin/agent_mascot.rs"

[[bin]]
name = "drama-worker"
path = "src/bin/drama_worker.rs"
